name: Inject Gemini API Key

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Replace placeholder with secret
        run: |
          sed "s/__GEMINI_KEY__/${{ secrets.GEMINI_KEY }}/g" script.js > temp.js
          mv temp.js script.js

      - name: Commit updated script.js
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add script.js
          git commit -m "Injected API key"
          git push
