name: Inject Gemini API Key

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Inject API key
        run: |
          sed "s/__GEMINI_KEY__/${{ secrets.GEMINI_KEY }}/g" script.js > temp.js
          mv temp.js script.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add script.js
          git commit -m "Inject API key [skip ci]" || echo "No changes"
          git push
